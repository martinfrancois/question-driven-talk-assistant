name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Resolved from packageManager in package.json rather than "latest", so CI runs
          # the same bun as local checkouts and a bun release is not adopted the day it
          # ships. The cooldown in bunfig.toml needs bun 1.3.0+ to have any effect.
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint
      - name: Run type checks
        run: bun x tsc -p tsconfig.json --noEmit

      - name: Build frontend
        run: bun run build

      - name: Install Playwright Browsers
        run: bun x playwright install --with-deps
      # Fails the build when line coverage over src/** drops below the
      # threshold configured in vitest.config.ts.
      - name: Unit & Component Tests (enforces 80% line coverage)
        run: bun run test:unit
      # Start the frontend server in the background
      - name: Start frontend server
        run: |
          nohup bun run preview -- --port 5173 &
        shell: bash
      # Wait for the server to be ready
      - name: Wait for server to be ready
        run: bun x wait-on http://localhost:5173
      - name: Run Playwright tests
        run: bun run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: test-artifacts
          path: |
            playwright-report/
            src/**/__screenshots__/**/*.png
          retention-days: 30
