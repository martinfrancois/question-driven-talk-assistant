name: Claim issue
# `/take` on an issue assigns it to the commenter; see "Solve an issue" in
# CONTRIBUTING.md. The logic lives in martinfrancois/.github.
on:
  issue_comment:
    types: [created]
permissions: {}
jobs:
  claim:
    if: ${{ !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' }}
    permissions:
      issues: write
      pull-requests: read
    uses: martinfrancois/.github/.github/workflows/claim-issue.yml@1925fa011f1be824bc4d8c108f2c2e282cdb7c85 # v1.0.0
    with:
      max-open-claims: 3
