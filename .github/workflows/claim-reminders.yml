name: Claim reminders
# Reminds assignees without a pull request and releases quiet claims; see
# "Solve an issue" in CONTRIBUTING.md. The logic lives in martinfrancois/.github.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: claim-reminders
  cancel-in-progress: false
jobs:
  remind:
    permissions:
      issues: write
      pull-requests: read
    uses: martinfrancois/.github/.github/workflows/claim-reminders.yml@1925fa011f1be824bc4d8c108f2c2e282cdb7c85 # v1.0.0
    with:
      nudge-after-days: 14
      unassign-after-days: 7
