name: Claim reminders
# Reminds assignees without a pull request and releases quiet claims; see
# "Solve an issue" in CONTRIBUTING.md. The logic lives in martinfrancois/.github.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: claim-reminders
  cancel-in-progress: false
jobs:
  remind:
    permissions:
      issues: write
      pull-requests: read
    uses: martinfrancois/.github/.github/workflows/claim-reminders.yml@68636afb7ff462c30f2594c15d3cfe127e0b3e65 # v1.2.0
    with:
      nudge-after-days: 14
      unassign-after-days: 7
